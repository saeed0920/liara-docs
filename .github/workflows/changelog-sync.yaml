name: Sync merged PR to public changelog

on:
  pull_request:
    types: [closed]
    branches: [main, master]

permissions:
  contents: read
  issues: write

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-changelog:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'changelog')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout liara-docs
        uses: actions/checkout@v4

      - name: Checkout docs-blogs
        uses: actions/checkout@v4
        with:
          repository: saeed0920/docs-blogs
          token: ${{ secrets.BLOGS_REPO_TOKEN }}
          path: blogs

      - name: Build changelog entry
        id: build
        env:
          BLOGS_DIR: blogs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-changelog-entry.mjs

      - name: Open PR in docs-blogs
        id: cpr
        if: steps.build.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BLOGS_REPO_TOKEN }}
          path: blogs
          commit-message: "chore(changelog): add liara-docs PR #${{ github.event.pull_request.number }}"
          branch: ${{ steps.build.outputs.branch }}
          title: "Changelog: ${{ github.event.pull_request.title }}"
          body: |
            Generated from ${{ github.repository }}#${{ github.event.pull_request.number }}.

            Review is required; this PR will not auto-merge.

      - name: Comment on source PR
        if: steps.build.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl = '${{ steps.cpr.outputs.pull-request-url }}';
            if (!prUrl) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `📝 Changelog entry opened: ${prUrl}`,
            });
